# Starship prompt, based on the pastel-powerline preset (`starship preset pastel-powerline`).
# Colors are the terminal's 16 ANSI slots (0-15) rather than fixed hex, so the
# prompt follows whatever palette pywal16 gives the terminal, and open shells
# recolor with it. Without pywal16 it uses the terminal's default 16 colors.
#
# Segments, left to right:
#   username     bg 5   (accent)
#   directory    bg 4   (blue)
#   git          bg 6   (cyan)
#   languages    bg 2   (green)
# Ordered by hue (purple, blue, cyan, green) so each color flows into the next.
# Segment text is slot 0, since these slots are light.

"$schema" = 'https://starship.rs/config-schema.json'

# Each (...) group is hidden when all its modules are empty, and every arrow takes
# its color from the segment before it (prev_bg), so empty segments leave no gap.
format = """
[](fg:5)\
$os\
$username\
[](fg:prev_bg bg:4)\
$directory\
([](fg:prev_bg bg:6)\
$git_branch\
$git_status)\
([](fg:prev_bg bg:2)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$lua\
$maven\
$nodejs\
$bun\
$nim\
$python\
$rust\
$scala)\
[ ](fg:prev_bg)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "fg:0 bg:5"
style_root = "fg:0 bg:5"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "fg:0 bg:5"
disabled = true # Disabled by default

[directory]
style = "fg:0 bg:4"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[cpp]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[elixir]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[elm]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[git_branch]
symbol = ""
style = "fg:0 bg:6"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:0 bg:6"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[gradle]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[haskell]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[java]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[jj_bookmark]
symbol = ""
style = "fg:0 bg:6"
format = '[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ]($style)'

[jj_status]
style = "fg:0 bg:6"
format = '[$all ]($style)'

[julia]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[lua]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[maven]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[nodejs]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[bun]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[nim]
symbol = "󰆥"
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[python]
symbol = ""
style = "fg:0 bg:2"
# The active virtualenv's name after the symbol, hidden when none is active
format = '[ $symbol( $virtualenv) ]($style)'

[rust]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'

[scala]
symbol = ""
style = "fg:0 bg:2"
format = '[ $symbol ]($style)'
